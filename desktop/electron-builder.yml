appId: com.transcriptai.app
productName: TranscriptAI
directories:
  output: dist
files:
  - from: .
    filter:
      - package.json
      - src/**
# Shared resources bundled on every platform. Native binaries are added
# per-platform below (mac.extraResources / win.extraResources) so a DMG never
# ships Windows DLLs and an NSIS installer never ships macOS dylibs.
extraResources:
  # Include the built frontend (relative to desktop/ when running builder)
  - from: ../frontend/dist
    to: frontend_dist
  # Include prebuilt backend (directory for --onedir or binary for --onefile)
  # Place backend directory or binary under backend/bin before packaging
  - from: ../backend/bin
    to: backend
    filter:
      - "**/*"
  # Only bundle base model for a lean installer (~145MB)
  # Other models (tiny, small) are downloaded on-demand to the user data dir
  - from: ../backend-cpp/models/ggml-base.en.bin
    to: models/ggml-base.en.bin
mac:
  target: [dmg]
  category: public.app-category.productivity
  compression: store
  icon: build/icon.icns
  # Code Signing (uses Developer ID Application certificate)
  identity: "Balaji Sachidanandam (KVLNE2Y696)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization handled by afterSign hook (requires env vars: APPLE_ID, APPLE_ID_PASSWORD)
  notarize: false
  # macOS-only native binaries (whisper.cpp server + dylibs + key-listener helper)
  extraResources:
    - from: ../backend-cpp/mac/whisper-server
      to: whisper-server
    - from: ../backend-cpp/mac
      to: .
      filter:
        - "*.dylib"
    - from: node_modules/node-global-key-listener/bin
      to: bin
      filter:
        - "MacKeyServer"
afterSign: scripts/notarize.js
dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 400
  iconSize: 80
  iconTextSize: 12
win:
  target: [nsis]
  compression: maximum
  # Icon: electron-builder auto-detects build/icon.ico by convention when present.
  # Provide a 256x256 build/icon.ico (converted from build/icon.icns) for branding;
  # without it the default Electron icon is used.
  # Windows-only native binaries (whisper.cpp server + DLLs, ffmpeg, key-listener helper).
  # These are built from source / fetched into backend-cpp/win/ before packaging.
  extraResources:
    - from: ../backend-cpp/win/whisper-server.exe
      to: whisper-server.exe
    - from: ../backend-cpp/win
      to: .
      filter:
        - "*.dll"
        - "ffmpeg.exe"
        - "ffprobe.exe"
    - from: node_modules/node-global-key-listener/bin
      to: bin
      filter:
        - "WinKeyServer.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TranscriptAI
asar: true
publish:
  provider: github
  owner: sbpk516
  repo: transcriptai
  releaseType: draft
