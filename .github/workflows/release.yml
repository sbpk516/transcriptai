name: Release App

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: minor

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies (desktop)
        working-directory: desktop
        run: npm ci

      - name: Install Node dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Bump version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./desktop/package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case "${{ github.event.inputs.version_bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"

          # Update desktop/package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./desktop/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./desktop/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update docs/releases/latest.json
          if [ -f "docs/releases/latest.json" ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('./docs/releases/latest.json', 'utf8'));
              data.latestVersion = '$NEW_VERSION';
              data.releasedAt = new Date().toISOString();
              data.downloadUrl = data.downloadUrl.replace(/v[\d.]+\/TranscriptAI-[\d.]+/, 'v$NEW_VERSION/TranscriptAI-$NEW_VERSION');
              fs.writeFileSync('./docs/releases/latest.json', JSON.stringify(data, null, 2) + '\n');
            "
          fi

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          # Verify certificate
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Download Whisper model
        run: |
          mkdir -p backend-cpp/models
          if [ ! -f "backend-cpp/models/ggml-base.en.bin" ]; then
            echo "Downloading ggml-base.en.bin..."
            curl -L -o backend-cpp/models/ggml-base.en.bin \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
            echo "Model downloaded ($(du -h backend-cpp/models/ggml-base.en.bin | cut -f1))"
          fi

      - name: Build backend
        working-directory: backend
        run: bash build-backend.sh

      - name: Build frontend
        working-directory: frontend
        run: npm run build:electron

      - name: Build Mac Key Server
        working-directory: desktop
        run: npm run build:mac-key-server

      - name: Run prepack checks
        working-directory: desktop
        run: npm run prepack:check

      - name: Build DMG
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder -c electron-builder.yml

      - name: Staple notarization ticket
        run: |
          DMG_FILE=$(find desktop/dist -name "TranscriptAI-*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "Stapling $DMG_FILE..."
            xcrun stapler staple "$DMG_FILE" || echo "Stapling failed (notarization may still be processing)"
          fi

      - name: Verify code signing
        run: |
          DMG_FILE=$(find desktop/dist -name "TranscriptAI-*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            MOUNT_POINT=$(mktemp -d)
            hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_POINT" -quiet
            APP_PATH=$(find "$MOUNT_POINT" -name "*.app" -maxdepth 1 | head -1)
            if [ -n "$APP_PATH" ]; then
              codesign -v --deep --strict "$APP_PATH" && echo "Code signature valid" || echo "Code signature verification failed"
              spctl -a -t exec -vv "$APP_PATH" 2>&1 || true
            fi
            hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json docs/releases/latest.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v$VERSION"
          DMG_FILE=$(find desktop/dist -name "TranscriptAI-*.dmg" | head -1)

          # Create tag
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          # Create release
          RELEASE_ARGS=(
            "$TAG_NAME"
            "$DMG_FILE"
            --title "TranscriptAI $TAG_NAME"
            --latest
            --notes "## TranscriptAI $TAG_NAME

          ### Install
          1. Download the DMG file below
          2. Open the DMG and drag TranscriptAI to Applications
          3. Launch TranscriptAI from Applications"
          )

          # Upload latest.json if it exists
          if [ -f "docs/releases/latest.json" ]; then
            RELEASE_ARGS+=("docs/releases/latest.json")
          fi

          gh release create "${RELEASE_ARGS[@]}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
